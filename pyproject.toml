[project]
name = "paper2html-validator"
version = "0.1.0"
description = "Independent validator for Paper2HTML Structured Document Package 0.1"
readme = "VALIDATOR.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2025.1",
  "jsonschema[format]>=4.23,<5",
  "lxml>=5.3,<7",
  "pillow>=11,<13",
  "saxonche>=12.5,<13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "lxml-stubs>=0.5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["validator"]
disable_error_code = ["no-any-return", "override", "attr-defined", "union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "saxonche"
ignore_missing_imports = true
